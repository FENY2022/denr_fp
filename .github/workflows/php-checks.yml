name: PHP Code Checks
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'database/**'
      - 'tests/**'
      - '.github/workflows/php-checks.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'public/**'
      - 'database/**'
      - 'tests/**'
      - '.github/workflows/php-checks.yml'
jobs:
  php-lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Check PHP syntax
        run: find app public scripts tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run domain and User Management tests
        run: |
          php tests/domain_test.php
          php tests/registration_attachments_test.php
          php tests/user_management_test.php
          php tests/user_setup_modal_test.php
          php tests/user_edit_modal_test.php
          php tests/user_office_email_test.php
          php tests/client_separation_test.php
          php tests/registration_drafts_test.php
          php tests/registration_otp_test.php
          php tests/registration_security_diagnostics_test.php
