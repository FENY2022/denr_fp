name: FP-OMS PHP Build Checks

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'tests/**'
      - '.github/workflows/step2-php-checks.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint-and-step2-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FP-OMS
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: fileinfo, pdo_mysql, mbstring, openssl, zlib
          coverage: none
      - name: Lint all PHP source files
        shell: bash
        run: |
          find app public scripts tests -type f -name '*.php' -print0 |
            xargs -0 -n 1 php -l
      - name: Step 2 DB-free unit checks
        run: php tests/step2_domain_test.php
      - name: Step 2 schema compatibility checks
        run: php tests/step2_schema_check_test.php
      - name: Validate FP supporting draft UI and path safety
        run: php tests/step2_drafts_test.php
      - name: JavaScript syntax check for FP supporting uploader
        run: node --check public/assets/permit-step2-drafts.js
      - name: JavaScript syntax checks for review modals
        run: node --check public/assets/decision-confirm.js
      - name: Validate public Annex 1 FP requirements
        run: php tests/landing_requirements_test.php
      - name: Validate applicant dashboard Annex 1 checklist
        run: php tests/applicant_dashboard_requirements_test.php
      - name: Validate PNG branding and PWA icon references
        run: php tests/branding_icons_test.php
