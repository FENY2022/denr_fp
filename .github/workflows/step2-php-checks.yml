name: FP-OMS PHP Build Checks

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'tests/**'
      - '.github/workflows/step2-php-checks.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint-and-step2-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FP-OMS
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: fileinfo, pdo_mysql, mbstring, openssl, zlib
          coverage: none
      - name: Lint all PHP source files
        shell: bash
        run: |
          find app public scripts tests -type f -name '*.php' -print0 |
            xargs -0 -n 1 php -l
      - name: Entity registration requirements checks
        run: php tests/registration_requirements_test.php
      - name: Client uploads matched to LPDD-FUS review
        run: php tests/registration_reviewer_uploads_test.php
      - name: LPDD-FUS mirrored five-section reviewer layout
        run: php tests/registration_reviewer_layout_test.php
      - name: Reviewer document preview JavaScript syntax
        run: node --check public/assets/registration-document-preview.js
      - name: Registration document Previous/Next, counter and download behavior
        run: node tests/registration_document_navigation_test.js
      - name: Applicant registration section layout
        run: php tests/registration_section_layout_test.php
      - name: Applicant review confirmation and private preview checks
        run: php tests/registration_review_confirm_test.php
      - name: Applicant review script syntax
        run: node --check public/assets/registration-review-confirm.js
      - name: Registration requirements JS syntax
        run: node --check public/assets/registration-requirements.js
      - name: Step 2 DB-free unit checks
        run: php tests/step2_domain_test.php
      - name: Step 2 schema compatibility checks
        run: php tests/step2_schema_check_test.php
      - name: Validate FP supporting draft UI and path safety
        run: php tests/step2_drafts_test.php
      - name: JavaScript syntax check for FP supporting uploader
        run: node --check public/assets/permit-step2-drafts.js
      - name: JavaScript syntax check for PDF page organizer
        run: node --check public/assets/permit-pdf-organizer.js
      - name: JavaScript syntax check for PDF upload choice
        run: node --check public/assets/permit-pdf-choice.js
      - name: PDF upload choice Yes/No/Cancel behavior tests
        run: node tests/step2_pdf_choice_test.js
      - name: Validate map coordinates and project location UI
        run: php tests/step2_location_test.php
      - name: JavaScript syntax check for project map
        run: node --check public/assets/permit-location-map.js
      - name: JavaScript syntax checks for review modals
        run: node --check public/assets/decision-confirm.js
      - name: Validate public Annex 1 FP requirements
        run: php tests/landing_requirements_test.php
      - name: Validate applicant dashboard Annex 1 checklist
        run: php tests/applicant_dashboard_requirements_test.php
      - name: Validate PNG branding and PWA icon references
        run: php tests/branding_icons_test.php
